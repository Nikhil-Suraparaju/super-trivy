name: Semgrep Security Scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep scan (JSON)
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json \
            .

      - name: Run Semgrep scan (SARIF)
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            .

      - name: Upload Semgrep JSON artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-json
          path: semgrep-results.json
          retention-days: 30

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep-results.sarif
          retention-days: 30
