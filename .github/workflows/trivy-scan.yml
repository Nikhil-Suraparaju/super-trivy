name: Trivy Security Scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-fs-scan:
    name: Filesystem & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy filesystem scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Run Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload filesystem scan JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-json
          path: trivy-fs-results.json
          retention-days: 30

      - name: Upload filesystem scan SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-sarif
          path: trivy-fs-results.sarif
          retention-days: 30

  trivy-config-scan:
    name: IaC & Misconfiguration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy config scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: json
          output: trivy-config-results.json
          exit-code: 0

      - name: Run Trivy config scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config-results.sarif
          exit-code: 0

      - name: Upload config scan JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-json
          path: trivy-config-results.json
          retention-days: 30

      - name: Upload config scan SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-config-sarif
          path: trivy-config-results.sarif
          retention-days: 30

  trivy-image-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t healthcare-portal:${{ github.sha }} .

      - name: Run Trivy image scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: healthcare-portal:${{ github.sha }}
          format: json
          output: trivy-image-results.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: healthcare-portal:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Upload image scan JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-json
          path: trivy-image-results.json
          retention-days: 30

      - name: Upload image scan SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-image-results.sarif
          retention-days: 30

  trivy-combined-report:
    name: Generate Combined Report
    runs-on: ubuntu-latest
    needs: [trivy-fs-scan, trivy-config-scan, trivy-image-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Merge JSON reports
        run: |
          echo "Merging Trivy scan reports..."

          FILES=""

          [ -f trivy-fs-json/trivy-fs-results.json ] && FILES="$FILES trivy-fs-json/trivy-fs-results.json"
          [ -f trivy-config-json/trivy-config-results.json ] && FILES="$FILES trivy-config-json/trivy-config-results.json"
          [ -f trivy-image-json/trivy-image-results.json ] && FILES="$FILES trivy-image-json/trivy-image-results.json"

          if [ -z "$FILES" ]; then
            echo "No scan reports found!"
            exit 1
          fi

          jq -s '{
            "SchemaVersion": 2,
            "ArtifactName": "${{ github.repository }}",
            "GeneratedAt": now | todate,
            "Results": [ .[] | .Results // [] | .[] ]
          }' $FILES > trivy-results.json

          echo "Combined report generated successfully."

      - name: Upload combined JSON report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-combined
          path: trivy-results.json
          retention-days: 30
