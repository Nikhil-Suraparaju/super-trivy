apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-portal-sa
  namespace: default
---
# Intentionally overly permissive ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: healthcare-portal-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: healthcare-portal-binding
subjects:
  - kind: ServiceAccount
    name: healthcare-portal-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: healthcare-portal-role
  apiGroup: rbac.authorization.k8s.io
